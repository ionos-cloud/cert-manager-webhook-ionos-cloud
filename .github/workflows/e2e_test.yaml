name: e2e tests
on:
  pull_request_target:

jobs:
    e2e-tests-using-token:
      runs-on: ubuntu-latest
      steps:
        - name: Create k8s Kind Cluster
          uses: helm/kind-action@v1
        - uses: azure/setup-helm@v5.0.1
          name: install helm
        - uses: actions/checkout@v7
          name: checkout
          with:
            ref: ${{ github.event.pull_request.head.sha }}
        - name: get current cert manager version
          id: get-cert-manager-version
          run: |
            echo "cert_manager_version=$(cat go.mod | grep github.com/cert-manager/cert-manager | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        - name: run e2e tests using token authentication
          env:
            TEST_ZONE_NAME: ${{ secrets.TEST_ZONE_NAME }}
            IONOS_TOKEN: ${{ secrets.IONOS_TOKEN }}
          run : |
           ./run-e2e-tests.sh --cert-manager-version ${{ steps.get-cert-manager-version.outputs.cert_manager_version }} --authentication-method token
    e2e-tests-using-username-password:
      runs-on: ubuntu-latest
      steps:
        - name: Create k8s Kind Cluster
          uses: helm/kind-action@v1
        - uses: azure/setup-helm@v5.0.1
          name: install helm
        - uses: actions/checkout@v7
          name: checkout
          with:
            ref: ${{ github.event.pull_request.head.sha }}
        - name: get current cert manager version
          id: get-cert-manager-version
          run: |
            echo "cert_manager_version=$(cat go.mod | grep github.com/cert-manager/cert-manager | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        - name: run e2e tests using username password authentication
          env:
            TEST_ZONE_NAME: ${{ secrets.TEST_ZONE_NAME }}
            IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
            IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          run : |
           ./run-e2e-tests.sh --cert-manager-version ${{ steps.get-cert-manager-version.outputs.cert_manager_version }} --authentication-method username-password

          
            