name: e2e tests
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
    e2e-tests-using-token:
      runs-on: ubuntu-latest
      environment: ci-tests
      timeout-minutes: 30
      permissions:
        contents: read
      if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false || github.event.label.name == 'ok-to-test' }}
      steps:
        - name: Create k8s Kind Cluster
          uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
          name: install helm
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          name: checkout
          with:
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            # needed to allow external PRs to run test workflows with pull_request_targets
            # there is nothing unsafe here, because external PRs need an approval
            # reference: https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
            allow-unsafe-pr-checkout: 'true'
        - name: get current cert manager version
          id: get-cert-manager-version
          run: |
            echo "cert_manager_version=$(cat go.mod | grep github.com/cert-manager/cert-manager | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        - name: run e2e tests using token authentication
          env:
            TEST_ZONE_NAME: ${{ secrets.TEST_ZONE_NAME }}
            IONOS_TOKEN: ${{ secrets.IONOS_TOKEN }}
          run : |
           ./run-e2e-tests.sh --cert-manager-version ${{ steps.get-cert-manager-version.outputs.cert_manager_version }} --authentication-method token
    e2e-tests-using-username-password:
      runs-on: ubuntu-latest
      environment: ci-tests
      timeout-minutes: 30
      permissions:
        contents: read
      if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false || github.event.label.name == 'ok-to-test' }}
      steps:
        - name: Create k8s Kind Cluster
          uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
          name: install helm
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          name: checkout
          with:
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            # needed to allow external PRs to run test workflows with pull_request_targets
            # there is nothing unsafe here, because external PRs need an approval
            # reference: https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
            allow-unsafe-pr-checkout: 'true'
        - name: get current cert manager version
          id: get-cert-manager-version
          run: |
            echo "cert_manager_version=$(cat go.mod | grep github.com/cert-manager/cert-manager | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        - name: run e2e tests using username password authentication
          env:
            TEST_ZONE_NAME: ${{ secrets.TEST_ZONE_NAME }}
            IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
            IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          run : |
           ./run-e2e-tests.sh --cert-manager-version ${{ steps.get-cert-manager-version.outputs.cert_manager_version }} --authentication-method username-password
